name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -c index.js
      - name: Syntax check lib and tests
        run: |
          set -e
          for f in lib/*.js tests/*.js; do
            node -c "$f"
          done
      - name: Verify frontend files referenced by server exist
        run: |
          test -f public/index.html
          test -f public/login.html
          test -f public/manifest.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
